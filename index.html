<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GOJI AI · Goji Empires</title>
<style>
:root{--bg:#04050a;--p1:#0a0e1a;--p2:#0e1426;--edge:#1a2650;--blue:#2f6bff;--deep:#0b2a8a;--gold:#e2b64d;--gold2:#8a6a1c;--tx:#e8ecf8;--mu:#7f8aa8;--ok:#3fd18a;--bad:#ff5a6a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg) radial-gradient(900px 500px at 85% -10%,#0b2a8a55,transparent),radial-gradient(700px 400px at 0% 100%,#e2b64d14,transparent);color:var(--tx);font:15px/1.5 "Segoe UI",system-ui,sans-serif;min-height:100vh;display:flex}
.rail{width:210px;flex:none;background:linear-gradient(180deg,#070a14,#04050a);border-right:1px solid var(--edge);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.logo{padding:6px 10px 18px;font-weight:800;letter-spacing:.28em;color:var(--gold);font-size:19px;text-shadow:0 0 18px #e2b64d55}
.logo small{display:block;letter-spacing:.35em;font-size:9px;color:var(--blue);font-weight:600;margin-top:2px}
.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;color:var(--mu);background:none;border:0;border-left:2px solid transparent;font:inherit;cursor:pointer;text-align:left;transition:.2s}
.nav:hover{color:var(--tx);background:#ffffff08}
.nav.on{color:var(--gold);background:linear-gradient(90deg,#2f6bff22,transparent);border-left-color:var(--gold)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
#st{margin-top:auto;font-size:11px;color:var(--mu);padding:8px 12px}#battery{font-size:10px;margin-top:5px;color:var(--gold)}
main{flex:1;min-width:0;padding:26px clamp(14px,3vw,38px);animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1{margin:0 0 4px;font-size:24px;letter-spacing:.06em;font-weight:700}
h1 b{color:var(--gold)}
.sub{color:var(--mu);margin:0 0 18px;font-size:13px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
input,select,textarea{background:#060912;border:1px solid var(--edge);color:var(--tx);border-radius:8px;padding:9px 11px;font:inherit;width:100%}
.bar input,.bar select{width:auto;flex:1;min-width:140px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px #2f6bff30}
textarea{min-height:90px;resize:vertical}
.btn{background:linear-gradient(180deg,#2f6bff,#1a45c4);border:1px solid #5b8cff;color:#fff;border-radius:8px;padding:9px 15px;font:inherit;font-weight:600;cursor:pointer;transition:.2s;text-decoration:none;display:inline-block}
.btn:hover{filter:brightness(1.15);box-shadow:0 0 18px #2f6bff55}
.btn.g{background:linear-gradient(180deg,#e2b64d,#a8801f);border-color:#f3d27a;color:#1a1200}
.btn.s{background:#ffffff0a;border-color:var(--edge);color:var(--tx);padding:5px 10px;font-size:13px;font-weight:500}
.btn.s:hover{box-shadow:none;border-color:var(--blue)}
.btn.d:hover{border-color:var(--bad);color:var(--bad)}
.split{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:18px;align-items:start}
.panel{background:linear-gradient(180deg,var(--p2),var(--p1));border:1px solid var(--edge);border-radius:12px;box-shadow:0 10px 30px #0008,inset 0 1px 0 #ffffff0a}
.row{display:flex;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid #ffffff0a;cursor:pointer;transition:.15s;border-left:2px solid transparent}
.row:hover{background:#2f6bff10}.row.on{background:#2f6bff1c;border-left-color:var(--gold)}
.th{width:44px;height:44px;border-radius:8px;background:#0b2a8a44 center/cover;border:1px solid var(--edge);flex:none;display:grid;place-items:center;color:var(--gold);font-weight:700}
.grow{flex:1;min-width:0}.nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mu{color:var(--mu);font-size:13px}
.pb{height:5px;border-radius:4px;background:#ffffff12;margin-top:6px;overflow:hidden}.pb i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--gold));transition:width .5s}
.det{padding:20px}.det img{width:100%;max-height:230px;object-fit:cover;border-radius:10px;border:1px solid var(--edge);margin-bottom:14px}
.chk{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid #ffffff08}
.chk input{width:18px;height:18px;accent-color:var(--gold)}.chk.done span{text-decoration:line-through;color:var(--mu)}
.tag{font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--edge);color:var(--blue);margin-right:6px;white-space:nowrap}
.tag.g{color:var(--gold);border-color:var(--gold2)}.tag.ok{color:var(--ok);border-color:#1b6a47}.tag.bad{color:var(--bad);border-color:#7a2630}
.item{padding:14px 16px;border-left:3px solid var(--blue);margin-bottom:10px;border-radius:0 10px 10px 0;background:linear-gradient(90deg,#2f6bff12,transparent)}
.item.arc{opacity:.55;border-left-color:var(--mu)}.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.empty{padding:40px 20px;text-align:center;color:var(--mu)}
dialog{background:var(--p2);color:var(--tx);border:1px solid var(--gold2);border-radius:14px;width:min(520px,94vw);padding:22px;box-shadow:0 0 60px #000}
dialog::backdrop{background:#000b}label{display:block;font-size:12px;color:var(--mu);margin:12px 0 4px;letter-spacing:.04em}
#toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--p2);border:1px solid var(--gold);padding:12px 16px;border-radius:10px;max-width:340px;z-index:9;display:none}
video{width:100%;max-height:60vh;background:#000;border:1px solid var(--edge);border-radius:10px}
.chat{height:min(55vh,520px);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.m{max-width:85%;padding:10px 14px;border-radius:12px;white-space:pre-wrap;word-wrap:break-word}
.m.u{align-self:flex-end;background:#2f6bff33;border:1px solid #2f6bff66}.m.a{background:#ffffff08;border:1px solid var(--edge)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.stats{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:16px}.stats b{display:block;font-size:22px;color:var(--gold)}
@media(max-width:760px){body{flex-direction:column-reverse}
.rail{width:100%;height:auto;flex-direction:row;position:sticky;bottom:0;top:auto;border-right:0;border-top:1px solid var(--edge);padding:6px;overflow-x:auto;z-index:5}
.logo,#st{display:none}.nav{flex-direction:column;gap:2px;font-size:10px;padding:6px 10px;border-left:0;border-top:2px solid transparent}.nav.on{border-top-color:var(--gold)}
.split{grid-template-columns:1fr}}
.live{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.15em;border:1px solid var(--mu);color:var(--mu)}.live.on{color:#fff;background:#d62839;border-color:#ff6070;animation:pl 1.4s infinite}@keyframes pl{50%{box-shadow:0 0 14px #ff3b4e}}
.tx{display:grid;grid-template-columns:minmax(250px,320px) 1fr;gap:18px;align-items:start}.tx dl{margin:12px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px}.tx dt{color:var(--mu)}.tx dd{margin:0;word-break:break-word}
.hg,.gzg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}.hc{padding:18px;display:flex;flex-direction:column;gap:10px}.mono{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-weight:800;color:#1a1200;background:linear-gradient(145deg,#f3d27a,#a8801f);box-shadow:0 0 22px #e2b64d44}
.era{color:var(--gold);letter-spacing:.14em;font-size:14px;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--edge)}.era small{color:var(--mu);letter-spacing:0}.gc{display:flex;flex-direction:column;transition:.2s}.gc:hover{transform:translateY(-3px);border-color:var(--blue)}.po{aspect-ratio:2/3;background:linear-gradient(160deg,#0b2a8a,#04050a) center/cover;border-radius:12px 12px 0 0;display:grid;place-items:center;text-align:center;font-size:34px;font-weight:800;color:var(--gold);padding:10px}.po small{display:block;font-size:11px;color:var(--mu);letter-spacing:.2em}.gb{padding:12px 14px;display:flex;flex-direction:column;gap:6px;flex:1}.gb p{margin:0;font-size:13px;color:var(--mu);flex:1}
@media(max-width:760px){.tx{grid-template-columns:1fr}}
.tx-float{position:fixed;right:16px;bottom:16px;width:min(370px,calc(100vw - 24px));z-index:20;background:#080d1b;border:1px solid var(--gold2);border-radius:14px;box-shadow:0 18px 55px #000d;overflow:hidden}
.tx-float-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;background:#111a30;border-bottom:1px solid var(--edge)}
.tx-float-body{padding:10px;display:grid;gap:8px}.tx-float-media{display:grid;grid-template-columns:1fr 92px;gap:7px}.tx-float video{width:100%;height:104px;max-height:104px;object-fit:contain;background:#000;border:1px solid var(--edge);border-radius:8px}.tx-float .cam-off{height:104px;display:grid;place-items:center;border:1px dashed var(--edge);border-radius:8px;color:var(--mu);font-size:11px;text-align:center}
.tx-float-chat{height:112px;overflow:auto;display:flex;flex-direction:column;gap:5px;padding:6px;background:#040711;border:1px solid var(--edge);border-radius:8px}.tx-float-chat .m{font-size:12px;padding:5px 8px;max-width:95%}.tx-float-send{display:flex;gap:6px}.tx-float-send input{min-width:0;padding:7px;font-size:12px}.tx-float-send .btn{padding:6px 9px;font-size:12px}
@media(max-width:760px){.tx-float{right:8px;bottom:76px;width:min(340px,calc(100vw - 16px))}}
.cinema-backdrop{position:fixed;inset:0;z-index:1000;background:#000e;display:grid;place-items:center;padding:18px}
.cinema-screen{width:min(760px,96vw);max-height:92vh;overflow:auto;background:radial-gradient(ellipse at 50% 0%,#172653,#070a13 65%);border:1px solid var(--gold2);border-radius:18px;padding:clamp(18px,4vw,34px);box-shadow:0 25px 100px #000}
.cinema-kicker{color:var(--gold);letter-spacing:.24em;font-size:11px;font-weight:800}
.cinema-screen h2{font-size:clamp(24px,5vw,38px);line-height:1.12;margin:10px 0}
.cinema-screen p{color:var(--mu)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<nav class="rail" id="rail"></nav><main id="main"></main><div id="toast"></div><div id="tx-float"></div>
<dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>Math.random().toString(36).slice(2,9);
const IC={projects:'<path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M12 12l9-5M12 12v10M12 12L3 7"/>',ideas:'<path d="M9 18h6M10 21h4M12 3a6 6 0 00-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0012 3z"/>',movies:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/>',games:'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 01-10 0zM17 5h3v2a3 3 0 01-3 3M7 5H4v2a3 3 0 003 3"/>',screen:'<rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>',ai:'<path d="M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2zM19 15l1 2 2 1-2 1-1 2-1-2-2-1 2-1z"/>',hub:'<circle cx="12" cy="12" r="3"/><circle cx="5" cy="5" r="2"/><circle cx="19" cy="5" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="19" r="2"/><path d="M7 7l3 3M17 7l-3 3M7 17l3-3M17 17l-3-3"/>',gz:'<path d="M3 20l3-8 2 4 3-10 3 10 2-4 3 8z"/>',data:'<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>,book:'<path d="M4 5.5A2.5 2.5 0 016.5 3H20v16H6.5A2.5 2.5 0 014 16.5z"/><path d="M4 16.5A2.5 2.5 0 016.5 14H20M8 7h8M8 10h8"/>'};
const NAV=[['projects','Proyectos'],['ideas','Ideas'],['movies','Películas'],['games','Logros'],['gz','Godzilla'],['screen','Transmisor'],['hub','IA Hub'],['ai','GOJI AI'],['appearance','Apariencia'],['data','Datos'],['library','Enciclopedia']];
const ico=n=>`<svg class="i" viewBox="0 0 24 24">${IC[n]||IC.data}</svg>`;
const CFG={projects:{c:'tasks',cl:'Tareas',ph:'Nueva tarea…',nw:'Nuevo proyecto',f:[{k:'name',l:'Nombre'},{k:'status',l:'Estado',t:'select',o:['Idea','En desarrollo','Pausado','Terminado']},{k:'desc',l:'Descripción',t:'textarea'},{k:'img',l:'Imagen',t:'img'},{k:'progress',l:'Progreso manual % (solo se usa si no hay tareas)',t:'number'}],sub:x=>x.status||''},
games:{c:'trophies',cl:'Trofeos y logros',ph:'Nuevo trofeo o logro…',nw:'Añadir videojuego',f:[{k:'name',l:'Videojuego'},{k:'platform',l:'Plataforma (PC, PS5, Xbox, Switch…)'},{k:'status',l:'Estado',t:'select',o:['Pendiente','Jugando','Completado']},{k:'img',l:'Portada',t:'img'}],sub:x=>[x.platform,x.status].filter(Boolean).join(' · ')}};
const MF=[{k:'title',l:'Título'},{k:'year',l:'Año',t:'number'},{k:'universe',l:'Universo',t:'select',o:['Godzilla','Los Simpson','Marvel','Otros']},{k:'status',l:'Estado',t:'select',o:['Pendiente','Vista']},{k:'rating',l:'Puntuación (0-10)',t:'number'},{k:'genre',l:'Género'},{k:'coll',l:'Colección / saga'},{k:'platform',l:'Dónde la verás (lo anotas tú)'},{k:'youtube',l:'Enlace de YouTube autorizado (película completa)'},{k:'remind',l:'Recordarme ver la película el…',t:'datetime-local'}];
const IF=[{k:'title',l:'Título'},{k:'cat',l:'Categoría',t:'select',o:['Jugabilidad','Historia','Personajes','Arte','Técnica','Marketing','Otra']},{k:'body',l:'Descripción',t:'textarea'}];
let S={projects:['GDA','GSA','SPIDER DOOM','MONSTER DESTRUCTION'].map(n=>({id:uid(),name:n,status:'En desarrollo',desc:'',img:'',progress:0,tasks:[]})),ideas:[],movies:[],games:[],chat:[],profile:'Le gusta Godzilla y los kaijus, Goji Empires, GDA, GSA, SPIDER DOOM y Postal 2. Prefiere español informal, respuestas directas y pasos prácticos. Valora los juegos gratuitos, completos, sin anuncios ni pay-to-win. Disfruta ayuda para completar logros y entender qué hacer durante la partida.',memory:'',appearance:{preset:'imperial',image:'',accent:'#e2b64d'}},view='projects',sel={},q='',stream=null,cameraStream=null,micStream=null,busy=false,voiceEnabled=false,recognition=null,batteryText='Batería: comprobando…',batteryRef=null;
/* ---------- almacenamiento (IndexedDB) ---------- */
const idb=()=>new Promise((r,j)=>{const o=indexedDB.open('goji-ai',1);o.onupgradeneeded=()=>o.result.createObjectStore('kv');o.onsuccess=()=>r(o.result);o.onerror=()=>j(o.error)});
async function load(){try{const d=await idb();return await new Promise(r=>{const g=d.transaction('kv').objectStore('kv').get('state');g.onsuccess=()=>r(g.result);g.onerror=()=>r(null)})}catch(e){return null}}
async function save(){try{const d=await idb();await new Promise((resolve,reject)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(S,'state');t.oncomplete=()=>{$('#save-status').textContent='● Guardado '+new Date().toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'});resolve(true)};t.onerror=()=>{const e=t.error||new Error('Error de IndexedDB');$('#save-status').textContent='⚠ Error al guardar';reject(e)};t.onabort=()=>reject(t.error||new Error('Guardado cancelado'))})}catch(e){$('#save-status').textContent='⚠ Sin almacenamiento en este navegador';return false}return true}
const toast=(t,ms=5000)=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',ms)};
/* ---------- formularios ---------- */
let pendImg=null;
function img(file){return new Promise(r=>{const f=new FileReader();f.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,520/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.72))};i.src=f.result};f.readAsDataURL(file)})}
function form(title,fields,v,cb){pendImg=null;const d=$('#dlg');
d.innerHTML=`<h2 style="margin:0;color:var(--gold);font-size:18px">${esc(title)}</h2><form method="dialog" id="fm">`+fields.map(f=>`<label>${esc(f.l)}</label>`+(f.t==='textarea'?`<textarea id="f_${f.k}">${esc(v[f.k])}</textarea>`:f.t==='select'?`<select id="f_${f.k}">${f.o.map(o=>`<option ${v[f.k]===o?'selected':''}>${o}</option>`).join('')}</select>`:f.t==='img'?`<input type="file" id="f_${f.k}" accept="image/*">`:`<input id="f_${f.k}" type="${f.t||'text'}" value="${esc(v[f.k])}" ${f.t==='number'?'min="0" max="3000"':''}>`)).join('')+`<div class="acts" style="margin-top:18px"><button class="btn g" value="ok">Guardar</button><button class="btn s" value="x" type="button" onclick="$('#dlg').close()">Cancelar</button></div></form>`;
fields.filter(f=>f.t==='img').forEach(f=>$('#f_'+f.k).onchange=async e=>{if(e.target.files[0])pendImg=await img(e.target.files[0])});
$('#fm').onsubmit=e=>{const o={};for(const f of fields){if(f.t==='img'){o[f.k]=pendImg??v[f.k]??'';continue}const x=$('#f_'+f.k).value.trim();o[f.k]=f.t==='number'?(x===''?'':Math.max(0,+x)):x}
if(!fields[0].nr&&!(o.name||o.title)){e.preventDefault();toast('Falta el nombre o título');return}cb(o)};d.showModal()}
/* ---------- vistas ---------- */
const pct=(x,c)=>x[c]?.length?Math.round(x[c].filter(t=>t.done).length*100/x[c].length):(+x.progress||0);
function cols(key){const C=CFG[key],a=S[key].filter(x=>!q||(x.name+' '+(x.desc||'')).toLowerCase().includes(q.toLowerCase())),cur=S[key].find(x=>x.id===sel[key])||a[0];
const list=a.length?a.map(x=>`<div class="row ${cur&&x.id===cur.id?'on':''}" data-act="sel" data-k="${key}" data-id="${x.id}"><div class="th" style="${x.img?`background-image:url(${x.img})`:''}">${x.img?'':esc(x.name[0])}</div><div class="grow"><div class="nm">${esc(x.name)}</div><div class="mu">${esc(C.sub(x))}</div><div class="pb"><i style="width:${pct(x,C.c)}%"></i></div></div><b style="color:var(--gold)">${pct(x,C.c)}%</b></div>`).join(''):`<div class="empty">Sin resultados.</div>`;
let det=`<div class="empty">Selecciona o crea un elemento.</div>`;
if(cur){const t=cur[C.c]||[],dn=t.filter(z=>z.done).length;det=`<div class="det">${cur.img?`<img src="${cur.img}" alt="">`:''}<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><h2 style="margin:0">${esc(cur.name)}</h2><div class="mu">${esc(C.sub(cur))}</div></div><div class="acts" style="margin:0"><button class="btn s" data-act="edit" data-k="${key}" data-id="${cur.id}">Editar</button><button class="btn s d" data-act="del" data-k="${key}" data-id="${cur.id}">Eliminar</button></div></div>
${cur.desc?`<p style="white-space:pre-wrap">${esc(cur.desc)}</p>`:''}<h3 style="margin:18px 0 6px;font-size:14px;color:var(--gold);letter-spacing:.08em">${C.cl.toUpperCase()} · ${dn}/${t.length}</h3>
${t.map(z=>`<div class="chk ${z.done?'done':''}"><input type="checkbox" ${z.done?'checked':''} data-act="tg" data-k="${key}" data-id="${cur.id}" data-t="${z.id}"><span class="grow">${esc(z.t)}</span><button class="btn s d" data-act="dt" data-k="${key}" data-id="${cur.id}" data-t="${z.id}">✕</button></div>`).join('')||`<div class="mu" style="padding:8px 0">Aún no hay ${C.cl.toLowerCase()}.</div>`}

case'ss':try{stream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:false});stream.getVideoTracks()[0].onended=()=>{stream=null;if(view==='screen')render()};render()}catch(er){toast(er.name==='NotAllowedError'?'Permiso denegado o selección cancelada.':'No se pudo iniciar la transmisión: '+er.message)}break;

case'chip':ask(D.t);break;case'send':{const i=$('#ai_in');if(i.value.trim()){const t=i.value;i.value='';ask(t)}break}

case'rst':if(confirm('Se borrarán TODOS los datos de GOJI AI. ¿Continuar? (Exporta antes una copia)')){S={projects:[],ideas:[],movies:[],games:[],chat:[],gz:{},ais:[],librarySeen:[],memory:'',appearance:{preset:'imperial',image:'',accent:'#e2b64d'}};commit()}break}});

async function imp(e){const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(j.app!=='GOJI AI'||!j.data)throw 0;const d=j.data;if(!confirm('Esto sustituirá tus datos actuales por la copia. ¿Continuar?'))return;S={...S,...d,projects:d.projects||[],ideas:d.ideas||[],movies:d.movies||[],games:d.games||[],chat:d.chat||[],gz:d.gz||{},ais:d.ais||[],librarySeen:d.librarySeen||[],memory:d.memory||'',appearance:d.appearance||{preset:'imperial',image:'',accent:'#e2b64d'}};commit();toast('Copia importada correctamente.')}catch(er){toast('El archivo no es una copia válida de GOJI AI.')}}

const strip=a=>a.map(({img,...r})=>r);
const SYS='Eres GOJI AI, asistente de Goji Empires, un estudio de videojuegos. Responde en español, de forma breve y clara. Usa SIEMPRE las herramientas para consultar los datos del usuario y basa tus respuestas solo en ellos. Si no hay datos suficientes, dilo; no inventes proyectos, películas ni puntuaciones. Solo puedes leer datos: si sugieres cambios, indícalos para que el usuario los haga. Puedes recomendar películas pendientes del catálogo usando géneros, colecciones y puntuaciones de las vistas; no afirmes dónde está disponible una película.';
const T=(name,description,fn)=>({name,description,inputSchema:{type:'object',properties:{}},execute:async()=>fn()});
const TOOLS=[T('listar_proyectos','Proyectos con estado, progreso y tareas',()=>strip(S.projects).map(p=>({...p,progreso:pct(p,'tasks')}))),T('listar_ideas','Ideas con categoría y si están archivadas',()=>S.ideas.map(i=>({titulo:i.title,categoria:i.cat,descripcion:i.body,archivada:!!i.arc}))),T('listar_peliculas','Catálogo de películas vistas y pendientes',()=>S.movies.map(({id,...m})=>m)),T('listar_videojuegos','Videojuegos con plataforma y trofeos',()=>strip(S.games)),T('listar_godzilla','Películas de Godzilla vistas con puntuación personal',()=>GZ.filter(f=>S.gz?.[f[0]]?.status==='Vista').map(f=>({titulo:f[1],año:f[2],era:f[3],puntuacion:S.gz[f[0]].rating??null})))];
async function ask(text){if(pv!=='native')return askBE(text);const sm=window.claude?.use?await claude.use('sample'):null;if(!sm){toast('La IA no está disponible en esta vista: se necesita abrir GOJI AI desde claude.ai.');return}
S.chat.push({role:'user',content:text});const last={role:'assistant',content:''};S.chat.push(last);busy=true;render();
let h=S.chat.slice(-13,-1).map(m=>({role:m.role,content:m.content}));while(h[0]?.role!=='user')h.shift();h[0].content=SYS+'\n\nMemoria permanente del usuario:\n'+String(S.memory||'').slice(0,12000)+'\n\nPerfil y preferencias del usuario:\n'+String(S.profile||'').slice(0,5000)+'\n\n'+h[0].content;
const up=()=>{const l=$('#log');if(l){l.innerHTML=chatHTML();l.scrollTop=l.scrollHeight}};
try{const r=await sm(h,{tools:TOOLS,cache:false,onText:({text})=>{last.content=text;up()}});last.content=r.text;speakGoji(last.content)}catch(er){last.content=er.code==='not_granted'?'Permiso denegado para usar la IA.':er.code==='rate_limited'?'Límite alcanzado, inténtalo en un momento.':'Error de la IA ['+(er.code||'desconocido')+']: '+(er.message||'sin detalle')}
busy=false;save();render()}

(async()=>{const d=await load();if(d)S={...S,...d};/* GSA: ficha inicial ampliada sin pisar datos que el usuario ya haya escrito. */const gsa=S.projects.find(p=>String(p.name||'').trim().toUpperCase()==='GSA');if(gsa){if(!gsa.desc)gsa.desc='GODZILLA SAVE THE EARTH (GSA)\\n\\nExpansión de GDA presentada como una experiencia con identidad propia: tendrá menú, campaña y contenido diferenciados, pero forma parte del universo y proyecto GDA.\\n\\nVISIÓN DEL PROYECTO\\n• Campaña extensa y ramificada, con decisiones y rutas que den variedad a la aventura.\\n• Sistema de combate con mecánicas propias, diferenciadas de GDA; no será simplemente copiar sus combates.\\n• Mundos y escenarios 3D para explorar y combatir.\\n• Personajes y kaijus en 3D.\\n• Cinemáticas ilustradas a mano para contar la historia.\\n• Menú principal propio, con estética apocalíptica.\\n\\nDESARROLLO PROGRESIVO\\nEl proyecto se construirá por etapas, cuidando que cada sistema funcione antes de ampliar el contenido.';if(!Array.isArray(gsa.tasks))gsa.tasks=[];if(gsa.tasks.length===0)gsa.tasks=['Definir la historia principal y sus ramificaciones','Diseñar las rutas, decisiones y finales de la campaña','Definir las mecánicas de combate exclusivas de GSA','Diseñar los mundos y escenarios 3D','Planificar los personajes y kaijus 3D','Definir el estilo visual y las cinemáticas ilustradas a mano','Diseñar el menú apocalíptico y la identidad visual propia','Establecer cómo GSA se integra como expansión de GDA','Crear un prototipo jugable de combate','Crear un primer escenario 3D funcional','Integrar una primera secuencia narrativa ilustrada','Probar rendimiento y optimizar antes de ampliar el contenido'].map(t=>({id:uid(),t,done:false}));}if(!S.memory)S.memory='';if(!S.appearance)S.appearance={preset:'imperial',image:'',accent:'#e2b64d'};S.movies=S.movies||[];const starterFilms=[['Los Simpson: La película',2007,'Los Simpson','Animación'],['Iron Man',2008,'Marvel','Superhéroes'],['El increíble Hulk',2008,'Marvel','Superhéroes'],['Iron Man 2',2010,'Marvel','Superhéroes'],['Thor',2011,'Marvel','Superhéroes'],['Capitán América: El primer vengador',2011,'Marvel','Superhéroes'],['Los Vengadores',2012,'Marvel','Superhéroes'],['Guardianes de la Galaxia',2014,'Marvel','Ciencia ficción'],['Vengadores: La era de Ultrón',2015,'Marvel','Superhéroes'],['Capitán América: Civil War',2016,'Marvel','Superhéroes'],['Black Panther',2018,'Marvel','Superhéroes'],['Vengadores: Infinity War',2018,'Marvel','Superhéroes'],['Vengadores: Endgame',2019,'Marvel','Superhéroes'],['Spider-Man: No Way Home',2021,'Marvel','Superhéroes'],['Guardianes de la Galaxia Vol. 3',2023,'Marvel','Ciencia ficción'],['Deadpool y Lobezno',2024,'Marvel','Superhéroes']];starterFilms.forEach(([title,year,universe,genre])=>{if(!S.movies.some(m=>m.title===title))S.movies.push({id:uid(),title,year,universe,genre,coll:universe,status:'Pendiente',rating:'',youtube:'',platform:''})});if(S.speechEnabled===undefined)S.speechEnabled=true;if(S.micAutoStart===undefined)S.micAutoStart=false;if(!S.voiceLang)S.voiceLang='es-CL';if(!S.voiceRate)S.voiceRate=1;render();save();initBattery();due();setInterval(due,30000);if(!window.claude?.use)pv=localMode?'abacus':'openai';beLoad()})();
