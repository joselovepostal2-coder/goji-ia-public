<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GOJI AI · Goji Empires</title>
<style>
:root{--bg:#04050a;--p1:#0a0e1a;--p2:#0e1426;--edge:#1a2650;--blue:#2f6bff;--deep:#0b2a8a;--gold:#e2b64d;--gold2:#8a6a1c;--tx:#e8ecf8;--mu:#7f8aa8;--ok:#3fd18a;--bad:#ff5a6a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg) radial-gradient(900px 500px at 85% -10%,#0b2a8a55,transparent),radial-gradient(700px 400px at 0% 100%,#e2b64d14,transparent);color:var(--tx);font:15px/1.5 "Segoe UI",system-ui,sans-serif;min-height:100vh;display:flex}
.rail{width:210px;flex:none;background:linear-gradient(180deg,#070a14,#04050a);border-right:1px solid var(--edge);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.logo{padding:6px 10px 18px;font-weight:800;letter-spacing:.28em;color:var(--gold);font-size:19px;text-shadow:0 0 18px #e2b64d55}
.logo small{display:block;letter-spacing:.35em;font-size:9px;color:var(--blue);font-weight:600;margin-top:2px}
.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;color:var(--mu);background:none;border:0;border-left:2px solid transparent;font:inherit;cursor:pointer;text-align:left;transition:.2s}
.nav:hover{color:var(--tx);background:#ffffff08}
.nav.on{color:var(--gold);background:linear-gradient(90deg,#2f6bff22,transparent);border-left-color:var(--gold)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
#st{margin-top:auto;font-size:11px;color:var(--mu);padding:8px 12px}
main{flex:1;min-width:0;padding:26px clamp(14px,3vw,38px);animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1{margin:0 0 4px;font-size:24px;letter-spacing:.06em;font-weight:700}
h1 b{color:var(--gold)}
.sub{color:var(--mu);margin:0 0 18px;font-size:13px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
input,select,textarea{background:#060912;border:1px solid var(--edge);color:var(--tx);border-radius:8px;padding:9px 11px;font:inherit;width:100%}
.bar input,.bar select{width:auto;flex:1;min-width:140px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px #2f6bff30}
textarea{min-height:90px;resize:vertical}
.btn{background:linear-gradient(180deg,#2f6bff,#1a45c4);border:1px solid #5b8cff;color:#fff;border-radius:8px;padding:9px 15px;font:inherit;font-weight:600;cursor:pointer;transition:.2s;text-decoration:none;display:inline-block}
.btn:hover{filter:brightness(1.15);box-shadow:0 0 18px #2f6bff55}
.btn.g{background:linear-gradient(180deg,#e2b64d,#a8801f);border-color:#f3d27a;color:#1a1200}
.btn.s{background:#ffffff0a;border-color:var(--edge);color:var(--tx);padding:5px 10px;font-size:13px;font-weight:500}
.btn.s:hover{box-shadow:none;border-color:var(--blue)}
.btn.d:hover{border-color:var(--bad);color:var(--bad)}
.split{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:18px;align-items:start}
.panel{background:linear-gradient(180deg,var(--p2),var(--p1));border:1px solid var(--edge);border-radius:12px;box-shadow:0 10px 30px #0008,inset 0 1px 0 #ffffff0a}
.row{display:flex;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid #ffffff0a;cursor:pointer;transition:.15s;border-left:2px solid transparent}
.row:hover{background:#2f6bff10}.row.on{background:#2f6bff1c;border-left-color:var(--gold)}
.th{width:44px;height:44px;border-radius:8px;background:#0b2a8a44 center/cover;border:1px solid var(--edge);flex:none;display:grid;place-items:center;color:var(--gold);font-weight:700}
.grow{flex:1;min-width:0}.nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mu{color:var(--mu);font-size:13px}
.pb{height:5px;border-radius:4px;background:#ffffff12;margin-top:6px;overflow:hidden}.pb i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--gold));transition:width .5s}
.det{padding:20px}.det img{width:100%;max-height:230px;object-fit:cover;border-radius:10px;border:1px solid var(--edge);margin-bottom:14px}
.chk{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid #ffffff08}
.chk input{width:18px;height:18px;accent-color:var(--gold)}.chk.done span{text-decoration:line-through;color:var(--mu)}
.tag{font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--edge);color:var(--blue);margin-right:6px;white-space:nowrap}
.tag.g{color:var(--gold);border-color:var(--gold2)}.tag.ok{color:var(--ok);border-color:#1b6a47}.tag.bad{color:var(--bad);border-color:#7a2630}
.item{padding:14px 16px;border-left:3px solid var(--blue);margin-bottom:10px;border-radius:0 10px 10px 0;background:linear-gradient(90deg,#2f6bff12,transparent)}
.item.arc{opacity:.55;border-left-color:var(--mu)}.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.empty{padding:40px 20px;text-align:center;color:var(--mu)}
dialog{background:var(--p2);color:var(--tx);border:1px solid var(--gold2);border-radius:14px;width:min(520px,94vw);padding:22px;box-shadow:0 0 60px #000}
dialog::backdrop{background:#000b}label{display:block;font-size:12px;color:var(--mu);margin:12px 0 4px;letter-spacing:.04em}
#toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--p2);border:1px solid var(--gold);padding:12px 16px;border-radius:10px;max-width:340px;z-index:9;display:none}
video{width:100%;max-height:60vh;background:#000;border:1px solid var(--edge);border-radius:10px}
.chat{height:min(55vh,520px);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.m{max-width:85%;padding:10px 14px;border-radius:12px;white-space:pre-wrap;word-wrap:break-word}
.m.u{align-self:flex-end;background:#2f6bff33;border:1px solid #2f6bff66}.m.a{background:#ffffff08;border:1px solid var(--edge)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.stats{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:16px}.stats b{display:block;font-size:22px;color:var(--gold)}
@media(max-width:760px){body{flex-direction:column-reverse}
.rail{width:100%;height:auto;flex-direction:row;position:sticky;bottom:0;top:auto;border-right:0;border-top:1px solid var(--edge);padding:6px;overflow-x:auto;z-index:5}
.logo,#st{display:none}.nav{flex-direction:column;gap:2px;font-size:10px;padding:6px 10px;border-left:0;border-top:2px solid transparent}.nav.on{border-top-color:var(--gold)}
.split{grid-template-columns:1fr}}
.live{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.15em;border:1px solid var(--mu);color:var(--mu)}.live.on{color:#fff;background:#d62839;border-color:#ff6070;animation:pl 1.4s infinite}@keyframes pl{50%{box-shadow:0 0 14px #ff3b4e}}
.tx{display:grid;grid-template-columns:minmax(250px,320px) 1fr;gap:18px;align-items:start}.tx dl{margin:12px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px}.tx dt{color:var(--mu)}.tx dd{margin:0;word-break:break-word}
.hg,.gzg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}.hc{padding:18px;display:flex;flex-direction:column;gap:10px}.mono{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-weight:800;color:#1a1200;background:linear-gradient(145deg,#f3d27a,#a8801f);box-shadow:0 0 22px #e2b64d44}
.era{color:var(--gold);letter-spacing:.14em;font-size:14px;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--edge)}.era small{color:var(--mu);letter-spacing:0}.gc{display:flex;flex-direction:column;transition:.2s}.gc:hover{transform:translateY(-3px);border-color:var(--blue)}.po{aspect-ratio:2/3;background:linear-gradient(160deg,#0b2a8a,#04050a) center/cover;border-radius:12px 12px 0 0;display:grid;place-items:center;text-align:center;font-size:34px;font-weight:800;color:var(--gold);padding:10px}.po small{display:block;font-size:11px;color:var(--mu);letter-spacing:.2em}.gb{padding:12px 14px;display:flex;flex-direction:column;gap:6px;flex:1}.gb p{margin:0;font-size:13px;color:var(--mu);flex:1}
@media(max-width:760px){.tx{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<nav class="rail" id="rail"></nav><main id="main"></main><div id="toast"></div>
<dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>Math.random().toString(36).slice(2,9);
const IC={projects:'<path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M12 12l9-5M12 12v10M12 12L3 7"/>',ideas:'<path d="M9 18h6M10 21h4M12 3a6 6 0 00-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0012 3z"/>',movies:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/>',games:'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 01-10 0zM17 5h3v2a3 3 0 01-3 3M7 5H4v2a3 3 0 003 3"/>',screen:'<rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>',ai:'<path d="M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2zM19 15l1 2 2 1-2 1-1 2-1-2-2-1 2-1z"/>',hub:'<circle cx="12" cy="12" r="3"/><circle cx="5" cy="5" r="2"/><circle cx="19" cy="5" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="19" r="2"/><path d="M7 7l3 3M17 7l-3 3M7 17l3-3M17 17l-3-3"/>',gz:'<path d="M3 20l3-8 2 4 3-10 3 10 2-4 3 8z"/>',data:'<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>'};
const NAV=[['projects','Proyectos'],['ideas','Ideas'],['movies','Películas'],['games','Logros'],['gz','Godzilla'],['screen','Transmisor'],['hub','IA Hub'],['ai','GOJI AI'],['data','Datos']];
const ico=n=>`<svg class="i" viewBox="0 0 24 24">${IC[n]}</svg>`;
const CFG={projects:{c:'tasks',cl:'Tareas',ph:'Nueva tarea…',nw:'Nuevo proyecto',f:[{k:'name',l:'Nombre'},{k:'status',l:'Estado',t:'select',o:['Idea','En desarrollo','Pausado','Terminado']},{k:'desc',l:'Descripción',t:'textarea'},{k:'img',l:'Imagen',t:'img'},{k:'progress',l:'Progreso manual % (solo se usa si no hay tareas)',t:'number'}],sub:x=>x.status||''},
games:{c:'trophies',cl:'Trofeos y logros',ph:'Nuevo trofeo o logro…',nw:'Añadir videojuego',f:[{k:'name',l:'Videojuego'},{k:'platform',l:'Plataforma (PC, PS5, Xbox, Switch…)'},{k:'status',l:'Estado',t:'select',o:['Pendiente','Jugando','Completado']},{k:'img',l:'Portada',t:'img'}],sub:x=>[x.platform,x.status].filter(Boolean).join(' · ')}};
const MF=[{k:'title',l:'Título'},{k:'year',l:'Año',t:'number'},{k:'status',l:'Estado',t:'select',o:['Pendiente','Vista']},{k:'rating',l:'Puntuación (0-10)',t:'number'},{k:'genre',l:'Género'},{k:'coll',l:'Colección / saga'},{k:'platform',l:'Dónde la verás (lo anotas tú)'},{k:'remind',l:'Recordarme ver la película el…',t:'datetime-local'}];
const IF=[{k:'title',l:'Título'},{k:'cat',l:'Categoría',t:'select',o:['Jugabilidad','Historia','Personajes','Arte','Técnica','Marketing','Otra']},{k:'body',l:'Descripción',t:'textarea'}];
let S={projects:['GDA','GSA','SPIDER DOOM','MONSTER DESTRUCTION'].map(n=>({id:uid(),name:n,status:'En desarrollo',desc:'',img:'',progress:0,tasks:[]})),ideas:[],movies:[],games:[],chat:[]},view='projects',sel={},q='',stream=null,busy=false;
/* ---------- almacenamiento (IndexedDB) ---------- */
const idb=()=>new Promise((r,j)=>{const o=indexedDB.open('goji-ai',1);o.onupgradeneeded=()=>o.result.createObjectStore('kv');o.onsuccess=()=>r(o.result);o.onerror=()=>j(o.error)});
async function load(){try{const d=await idb();return await new Promise(r=>{const g=d.transaction('kv').objectStore('kv').get('state');g.onsuccess=()=>r(g.result);g.onerror=()=>r(null)})}catch(e){return null}}
async function save(){try{const d=await idb();const t=d.transaction('kv','readwrite');t.objectStore('kv').put(S,'state');t.oncomplete=()=>{$('#st').textContent='● Guardado '+new Date().toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'})};t.onerror=()=>$('#st').textContent='⚠ Error al guardar'}catch(e){$('#st').textContent='⚠ Sin almacenamiento en este navegador'}}
const toast=(t,ms=5000)=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',ms)};
/* ---------- formularios ---------- */
let pendImg=null;
function img(file){return new Promise(r=>{const f=new FileReader();f.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,520/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.72))};i.src=f.result};f.readAsDataURL(file)})}
function form(title,fields,v,cb){pendImg=null;const d=$('#dlg');
d.innerHTML=`<h2 style="margin:0;color:var(--gold);font-size:18px">${esc(title)}</h2><form method="dialog" id="fm">`+fields.map(f=>`<label>${esc(f.l)}</label>`+(f.t==='textarea'?`<textarea id="f_${f.k}">${esc(v[f.k])}</textarea>`:f.t==='select'?`<select id="f_${f.k}">${f.o.map(o=>`<option ${v[f.k]===o?'selected':''}>${o}</option>`).join('')}</select>`:f.t==='img'?`<input type="file" id="f_${f.k}" accept="image/*">`:`<input id="f_${f.k}" type="${f.t||'text'}" value="${esc(v[f.k])}" ${f.t==='number'?'min="0" max="3000"':''}>`)).join('')+`<div class="acts" style="margin-top:18px"><button class="btn g" value="ok">Guardar</button><button class="btn s" value="x" type="button" onclick="$('#dlg').close()">Cancelar</button></div></form>`;
fields.filter(f=>f.t==='img').forEach(f=>$('#f_'+f.k).onchange=async e=>{if(e.target.files[0])pendImg=await img(e.target.files[0])});
$('#fm').onsubmit=e=>{const o={};for(const f of fields){if(f.t==='img'){o[f.k]=pendImg??v[f.k]??'';continue}const x=$('#f_'+f.k).value.trim();o[f.k]=f.t==='number'?(x===''?'':Math.max(0,+x)):x}
if(!fields[0].nr&&!(o.name||o.title)){e.preventDefault();toast('Falta el nombre o título');return}cb(o)};d.showModal()}
/* ---------- vistas ---------- */
const pct=(x,c)=>x[c]?.length?Math.round(x[c].filter(t=>t.done).length*100/x[c].length):(+x.progress||0);
function cols(key){const C=CFG[key],a=S[key].filter(x=>!q||(x.name+' '+(x.desc||'')).toLowerCase().includes(q.toLowerCase())),cur=S[key].find(x=>x.id===sel[key])||a[0];
const list=a.length?a.map(x=>`<div class="row ${cur&&x.id===cur.id?'on':''}" data-act="sel" data-k="${key}" data-id="${x.id}"><div class="th" style="${x.img?`background-image:url(${x.img})`:''}">${x.img?'':esc(x.name[0])}</div><div class="grow"><div class="nm">${esc(x.name)}</div><div class="mu">${esc(C.sub(x))}</div><div class="pb"><i style="width:${pct(x,C.c)}%"></i></div></div><b style="color:var(--gold)">${pct(x,C.c)}%</b></div>`).join(''):`<div class="empty">Sin resultados.</div>`;
let det=`<div class="empty">Selecciona o crea un elemento.</div>`;
if(cur){const t=cur[C.c]||[],dn=t.filter(z=>z.done).length;det=`<div class="det">${cur.img?`<img src="${cur.img}" alt="">`:''}<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><h2 style="margin:0">${esc(cur.name)}</h2><div class="mu">${esc(C.sub(cur))}</div></div><div class="acts" style="margin:0"><button class="btn s" data-act="edit" data-k="${key}" data-id="${cur.id}">Editar</button><button class="btn s d" data-act="del" data-k="${key}" data-id="${cur.id}">Eliminar</button></div></div>
${cur.desc?`<p style="white-space:pre-wrap">${esc(cur.desc)}</p>`:''}<h3 style="margin:18px 0 6px;font-size:14px;color:var(--gold);letter-spacing:.08em">${C.cl.toUpperCase()} · ${dn}/${t.length}</h3>
${t.map(z=>`<div class="chk ${z.done?'done':''}"><input type="checkbox" ${z.done?'checked':''} data-act="tg" data-k="${key}" data-id="${cur.id}" data-t="${z.id}"><span class="grow">${esc(z.t)}</span><button class="btn s d" data-act="dt" data-k="${key}" data-id="${cur.id}" data-t="${z.id}">✕</button></div>`).join('')||`<div class="mu" style="padding:8px 0">Aún no hay ${C.cl.toLowerCase()}.</div>`}
<div class="bar" style="margin:12px 0 0"><input id="nt" placeholder="${C.ph}" data-enter="${key}|${cur.id}"><button class="btn" data-act="at" data-k="${key}" data-id="${cur.id}">Añadir</button></div></div>`}
return `<h1>${key==='projects'?'CENTRO DE <b>PROYECTOS</b>':'SALA DE <b>LOGROS</b>'}</h1><p class="sub">${key==='projects'?'El progreso se calcula con tus tareas completadas.':'Videojuegos, plataformas y trofeos conseguidos o pendientes.'}</p>
<div class="bar"><input id="q" placeholder="Buscar…" value="${esc(q)}"><button class="btn g" data-act="new" data-k="${key}">+ ${C.nw}</button></div><div class="split"><div class="panel">${list}</div><div class="panel">${det}</div></div>`}
function ideas(){const cats=['Todas',...IF[1].o],c=sel.ic||'Todas',arc=!!sel.arc;
const a=S.ideas.filter(i=>!!i.arc===arc&&(c==='Todas'||i.cat===c)&&(!q||(i.title+' '+i.body).toLowerCase().includes(q.toLowerCase())));
return `<h1>BÓVEDA DE <b>IDEAS</b></h1><p class="sub">${S.ideas.filter(i=>!i.arc).length} activas · ${S.ideas.filter(i=>i.arc).length} archivadas. Nada se borra a menos que lo elimines.</p>
<div class="bar"><input id="q" placeholder="Buscar ideas…" value="${esc(q)}"><select data-f="ic">${cats.map(x=>`<option ${x===c?'selected':''}>${x}</option>`).join('')}</select><select data-f="arc"><option value="">Activas</option><option value="1" ${arc?'selected':''}>Archivadas</option></select><button class="btn g" data-act="ni">+ Nueva idea</button></div>
${a.map(i=>`<div class="item ${i.arc?'arc':''}"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(i.title)}</b><span class="tag g">${esc(i.cat)}</span></div><div class="mu" style="white-space:pre-wrap;margin-top:4px">${esc(i.body)}</div><div class="acts"><button class="btn s" data-act="ei" data-id="${i.id}">Editar</button><button class="btn s" data-act="ai_" data-id="${i.id}">${i.arc?'Restaurar':'Archivar'}</button><button class="btn s d" data-act="di" data-id="${i.id}">Eliminar</button></div></div>`).join('')||'<div class="empty panel">No hay ideas aquí todavía.</div>'}`}
const jw=t=>'https://www.justwatch.com/es/buscar?q='+encodeURIComponent(t);
function movies(){const tab=sel.mt||'Todas',co=sel.mc||'',seen=S.movies.filter(m=>m.status==='Vista'),rt=seen.filter(m=>m.rating!=='');
const a=S.movies.filter(m=>(tab==='Todas'||m.status===tab)&&(!co||m.coll===co)&&(!q||(m.title+' '+m.genre+' '+m.coll).toLowerCase().includes(q.toLowerCase())));
const colls=[...new Set(S.movies.map(m=>m.coll).filter(Boolean))];
return `<h1>CINETECA <b>IMPERIAL</b></h1><div class="stats"><div><b>${seen.length}</b><span class="mu">vistas</span></div><div><b>${S.movies.length-seen.length}</b><span class="mu">pendientes</span></div><div><b>${rt.length?(rt.reduce((s,m)=>s+ +m.rating,0)/rt.length).toFixed(1):'–'}</b><span class="mu">media</span></div></div>

if(localMode)return `<div class="panel det" style="margin:0 0 16px"><b style="color:var(--gold);letter-spacing:.1em">GOJI AI LOCAL · TU PC</b><div class="mu" style="margin:6px 0">${be.st==='ok'?'<span style="color:var(--ok)">●</span> ':be.st==='err'?'<span style="color:var(--bad)">✗</span> ':'○ '}${esc(be.msg)}</div><label>Clave API de Abacus RouteLLM</label><input id="local_abacus_key" type="password" autocomplete="off" placeholder="Pega aquí tu clave de Abacus"><p class="mu">La clave se guarda en un archivo local de esta carpeta. No se envía a Render ni se publica en GitHub. Usa una clave con acceso a RouteLLM.</p><div class="acts"><button class="btn g" data-act="localkey">Guardar clave en este PC</button><button class="btn s" data-act="abmodels">Comprobar clave y cargar modelos</button></div><p class="mu">Los modelos y límites dependen de tu cuenta y plan de Abacus.</p></div>`;
return `<div class="panel det" style="margin:0 0 16px"><b style="color:var(--gold);letter-spacing:.1em">SERVIDOR PROPIO (RENDER)</b><div class="mu" style="margin:6px 0">${be.st==='ok'?'<span style="color:var(--ok)">●</span> ':be.st==='err'?'<span style="color:var(--bad)">✗</span> ':'○ '}${esc(be.msg)}</div><label>URL del servidor</label><input id="be_url" value="${esc((S.cfg||{}).api||'')}"><label>Código de acceso</label><input id="be_code" type="password" autocomplete="off" value="${esc(code())}"><p class="mu">Las API keys se guardan como variables privadas en Render; no las escribas en GitHub.</p><div class="acts"><button class="btn g" data-act="besave">Guardar y conectar</button></div></div>`;
}function aiBar(){const o=[...(window.claude?.use?[['native','Claude (integrado en claude.ai)']]:[]),...Object.entries(PN)];if(!o.some(x=>x[0]===pv))pv=o[0][0];const p=be.p[pv];
const st=pv==='native'?'Integrado, sin claves':be.st!=='ok'?'Sin servidor':!p?'Desconocido':!p.configured?'Falta '+p.env:p.state==='ok'?'Probado '+p.t:p.state==='err'?'Último intento falló':'Clave configurada, sin probar';
return `<div class="bar"><select data-pv>${o.map(x=>`<option value="${x[0]}" ${x[0]===pv?'selected':''}>${esc(x[1])}</option>`).join('')}</select><span class="tag">${esc(st)}</span>${pv==='native'?'':`<label class="chk" style="margin:0"><input type="checkbox" style="flex:none" data-ctx ${ctx?'checked':''}> Enviar mis datos (sin imágenes) al proveedor como contexto</label>`}${pv==='abacus'?`<select data-abmodel title="Modelo Abacus">${(abModels.length?abModels.map(x=>x.id):['route-llm']).map(x=>`<option value="${esc(x)}" ${x===abModel?'selected':''}>${esc(x)}</option>`).join('')}</select><button class="btn s" data-act="abmodels" ${abModelsLoading?'disabled':''}>${abModelsLoading?'Cargando…':'Actualizar modelos'}</button>`:''}</div>`}
const ctxData=()=>({proyectos:S.projects.map(p=>({nombre:p.name,estado:p.status,descripcion:p.desc,progreso:pct(p,'tasks'),tareas:p.tasks})),ideas:S.ideas.filter(i=>!i.arc).map(i=>({titulo:i.title,categoria:i.cat,descripcion:i.body})),peliculas:S.movies.map(({id,...m})=>m),juegos:strip(S.games)});
async function askBE(text){if(be.st!=='ok'){toast('Sin conexión con el servidor: '+be.msg+' Configúrala en IA Hub.',9000);return}const p=be.p[pv];if(!p||!p.configured){toast(p?'Falta la variable '+p.env+' en Render.':'Proveedor no disponible.',8000);return}
S.chat.push({role:'user',content:text});const last={role:'assistant',content:''};S.chat.push(last);busy=true;render();
let h=S.chat.slice(-13,-1).filter(m=>m.content&&!m.err).map(m=>({role:m.role,content:m.content}));while(h[0]&&h[0].role!=='user')h.shift();
try{const r=await api('/api/chat',{provider:pv,messages:h,model:pv==='abacus'?abModel:undefined,system:SYS_BE+(ctx?'\n\nDatos del usuario (JSON):\n'+JSON.stringify(ctxData()).slice(0,25000):'')});last.content=r.text;p.state='ok';p.t=hhmm()}
catch(er){last.content='Error ['+er.code+'] '+er.message;last.err=true;p.state='err';p.msg='['+er.code+'] '+er.message}busy=false;save();render()}
document.addEventListener('change',e=>{const d=e.target.dataset;if(d.pv!==undefined){pv=e.target.value;render()}if(d.ctx!==undefined)ctx=e.target.checked;if(d.abmodel!==undefined)abModel=e.target.value});
/* ===== DIAGNÓSTICO ===== */
let dg=null,dgBusy=false;const PT=[['ChatGPT (OpenAI)','https://api.openai.com/v1/models'],['Gemini (Google)','https://generativelanguage.googleapis.com/v1beta/models'],['DeepSeek','https://api.deepseek.com/models']];
function dgHTML(){if(!dg)return '';return `<div class="panel det" style="margin:0 0 16px"><b style="color:var(--gold);letter-spacing:.1em">DIAGNÓSTICO</b>${dg.map(r=>`<div class="chk"><span style="color:${r.ok?'var(--ok)':'var(--bad)'}">${r.ok?'✓':'✗'}</span><span class="grow"><b>${esc(r.n)}</b><div class="mu">${esc(r.t)}</div></span></div>`).join('')}${dgBusy?'<div class="mu">Probando…</div>':''}</div>`}
async function diag(){if(dgBusy)return;dgBusy=true;dg=[];const v=[],h=e=>v.push(e.blockedURI+' ['+e.violatedDirective+']'),add=(n,ok,t)=>{dg.push({n,ok,t});if(view==='hub')render()};document.addEventListener('securitypolicyviolation',h);render();
let s=null;try{s=window.claude?.use?await claude.use('sample'):null}catch(e){}
add('Claude (integración nativa)',!!s,s?'Disponible: GOJI AI puede consultar a Claude sin claves.':'No disponible en esta vista: ábrela desde claude.ai o el permiso fue denegado.');
for(const[n,u]of PT){v.length=0;try{const r=await fetch(u);add(n,false,'La petición llegó (HTTP '+r.status+') pero no hay clave configurada: sin autenticación no se puede usar.')}catch(e){await new Promise(r=>setTimeout(r,150));add(n,false,'Petición bloqueada ('+e.name+': '+e.message+'). '+(v.length?'Bloqueo de la política de seguridad de la página: '+v[0]+'.':'No se registró bloqueo de política de seguridad; puede ser CORS, red o un bloqueador de contenido.'))}}
add('Abacus AI',false,'Sin prueba: no tengo verificado un endpoint de API oficial.');
document.removeEventListener('securitypolicyviolation',h);dgBusy=false;if(view==='hub')render()}
const V={projects:()=>cols('projects'),games:()=>cols('games'),ideas,movies,screen,ai,data,hub,gz};
function render(){$('#rail').innerHTML=`<div class="logo">GOJI AI<small>GOJI EMPIRES</small></div>`+NAV.map(([k,l])=>`<button class="nav ${k===view?'on':''}" data-act="go" data-v="${k}">${ico(k)}${l}</button>`).join('')+`<div id="st">${$('#st')?.textContent||''}</div>`;
const m=$('#main');m.innerHTML=V[view]();const v=$('#vid');if(v&&stream)v.srcObject=stream;const l=$('#log');if(l)l.scrollTop=l.scrollHeight;const i=$('#imp');if(i)i.onchange=imp}
const go=v=>{view=v;q='';render();window.scrollTo(0,0)};
/* ---------- acciones ---------- */
const by=(k,id)=>S[k].find(x=>x.id===id),commit=()=>{save();render()};
document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;const D=b.dataset,k=D.k,id=D.id,C=CFG[k];
switch(D.act){case'go':go(D.v);break;case'ss':startTx(D.h);break;case'se':stopTx();break;
case'hadd':form('Añadir IA',[{k:'name',l:'Nombre'},{k:'url',l:'Dirección oficial (https://…)'},{k:'desc',l:'Descripción',t:'textarea'}],{},o=>{if(!/^https:\/\/[^\s\/]+\.[^\s]+$/i.test(o.url)){toast('No añadida: la dirección debe empezar por https://');return}S.ais=S.ais||[];S.ais.push({id:uid(),name:o.name,url:o.url,desc:o.desc});commit()});break;
case'hdel':S.ais=S.ais.filter(x=>x.id!==id);commit();break;case'hdiag':diag();break;
case'bekey':{const env=D.env||'';if(!/^(OPENAI|ANTHROPIC|GEMINI|DEEPSEEK|ABACUS)_API_KEY$/.test(env))break;try{await navigator.clipboard.writeText(env)}catch(er){}toast('Variable '+env+' copiada. En Render abre tu servicio → Environment → Add Environment Variable; pega el nombre y añade la clave en Value. No la compartas aquí.');window.open('https://dashboard.render.com','_blank','noopener');break}
case'localkey':{if(!localMode){toast('Esta opción solo está disponible en la versión local.');break}const key=$('#local_abacus_key')?.value.trim()||'';if(key.length<8){toast('Pega una clave API válida de Abacus.');break}try{await api('/api/local/key',{key});toast('Clave guardada localmente.');await beLoad()}catch(er){toast('No se pudo guardar la clave: '+er.message,8000)}break}
case'abmodels':{if(be.st!=='ok'||!be.p.abacus?.configured){toast(localMode?'Primero guarda tu clave de Abacus en este PC.':'Primero configura ABACUS_API_KEY en Render.');break}abModelsLoading=true;render();try{const r=await api('/api/abacus/models');abModels=(r.models||[]).filter(x=>x&&typeof x.id==='string');if(!abModels.some(x=>x.id===abModel))abModel=abModels.some(x=>x.id==='route-llm')?'route-llm':(abModels[0]?.id||'route-llm');toast('Catálogo Abacus actualizado: '+abModels.length+' modelos disponibles para tu clave.')}catch(er){toast('No se pudo cargar el catálogo: '+er.message,8000)}abModelsLoading=false;render();break}
case'besave':{const u=$('#be_url').value.trim().replace(/\/+$/,'');if(u&&!/^https?:\/\/[^\s]+$/i.test(u)){toast('La URL debe empezar por https://');break}S.cfg=S.cfg||{};S.cfg.api=u;try{sessionStorage.setItem('goji_code',$('#be_code').value)}catch(er){toast('El navegador no permite guardar el código en esta pestaña.')}save();beLoad();break}
case'betest':{const k=D.p,p=be.p[k];p.state='test';render();try{const r=await api('/api/chat',{provider:k,model:k==='abacus'?abModel:undefined,messages:[{role:'user',content:'Responde únicamente con la palabra OK.'}]});p.state='ok';p.t=hhmm();p.msg='';p.reply=r.text}catch(er){p.state='err';p.msg='['+er.code+'] '+er.message}render();break}
case'beuse':pv=D.p;go('ai');break;
case'gzt':{const c=S.gz[id]=S.gz[id]||{};c.status=c.status==='Vista'?'Pendiente':'Vista';commit();break}
case'gze':{const f=GZ.find(x=>x[0]===id),c=S.gz[id]||{};form(f[1],GF,{status:c.status||'Pendiente',rating:c.rating??'',url:c.url||'',poster:c.poster||''},o=>{if(o.url&&!/^https:\/\/[^\s]+$/i.test(o.url)){toast('Enlace no guardado: debe empezar por https://');o.url=''}if(o.rating!=='')o.rating=Math.min(10,o.rating);S.gz[id]={...c,...o};commit()});break}case'sel':sel[k]=id;render();break;
case'new':form(C.nw,C.f,{status:C.f[1].o?.[0]},o=>{S[k].push({id:uid(),...o,[C.c]:[]});sel[k]=S[k].at(-1).id;commit()});break;
case'edit':form('Editar',C.f,by(k,id),o=>{Object.assign(by(k,id),o);commit()});break;
case'del':if(confirm('¿Eliminar «'+by(k,id).name+'» y todo su contenido?')){S[k]=S[k].filter(x=>x.id!==id);commit()}break;
case'at':{const t=$('#nt').value.trim();if(t){by(k,id)[C.c].push({id:uid(),t,done:false});commit();$('#nt')?.focus()}break}
case'dt':{const x=by(k,id);x[C.c]=x[C.c].filter(z=>z.id!==D.t);commit();break}
case'ni':form('Nueva idea',IF,{cat:'Otra'},o=>{S.ideas.unshift({id:uid(),...o,arc:false,date:Date.now()});commit()});break;
case'ei':form('Editar idea',IF,by('ideas',id),o=>{Object.assign(by('ideas',id),o);commit()});break;
case'ai_':{const i=by('ideas',id);i.arc=!i.arc;commit();break}
case'di':if(confirm('¿Eliminar esta idea definitivamente?')){S.ideas=S.ideas.filter(x=>x.id!==id);commit()}break;
case'nm':form('Añadir película',MF,{status:'Pendiente'},o=>{S.movies.push({id:uid(),...o});if(o.remind&&'Notification'in window&&Notification.permission==='default')Notification.requestPermission();commit()});break;
case'em':form('Editar película',MF,by('movies',id),o=>{const m=by('movies',id);if(o.remind!==m.remind)m.done_r=false;Object.assign(m,o);if(o.remind&&'Notification'in window&&Notification.permission==='default')Notification.requestPermission();commit()});break;
case'tm':{const m=by('movies',id);m.status=m.status==='Vista'?'Pendiente':'Vista';commit();break}
case'dm':if(confirm('¿Eliminar esta película?')){S.movies=S.movies.filter(x=>x.id!==id);commit()}break;
case'ss':try{stream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:false});stream.getVideoTracks()[0].onended=()=>{stream=null;if(view==='screen')render()};render()}catch(er){toast(er.name==='NotAllowedError'?'Permiso denegado o selección cancelada.':'No se pudo iniciar la transmisión: '+er.message)}break;
case'se':stream?.getTracks().forEach(t=>t.stop());stream=null;render();break;
case'chip':ask(D.t);break;case'send':{const i=$('#ai_in');if(i.value.trim()){const t=i.value;i.value='';ask(t)}break}
case'cc':S.chat=[];commit();break;
case'exp':{const dl=window.claude?.use?await claude.use('downloads'):null,j=JSON.stringify({app:'GOJI AI',v:1,date:new Date().toISOString(),data:S},null,1);if(!dl){if(window.claude?.use){toast('La descarga no está disponible en esta vista.');break}try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));a.download='goji-ai-copia-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove()}catch(er){toast('No se pudo exportar: '+er.message)}break}try{await dl.save({filename:'goji-ai-copia-'+new Date().toISOString().slice(0,10)+'.json',data:j})}catch(er){if(er.code!=='declined')toast('No se pudo exportar: '+(er.message||er.code))}break}
case'rst':if(confirm('Se borrarán TODOS los datos de GOJI AI. ¿Continuar? (Exporta antes una copia)')){S={projects:[],ideas:[],movies:[],games:[],chat:[],gz:{},ais:[]};commit()}break}});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;render();const i=$('#q');i.focus();i.setSelectionRange(q.length,q.length)}});
document.addEventListener('change',e=>{const f=e.target.dataset.f;if(f){sel[f]=e.target.value;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.enter){const s=e.target.dataset.enter;e.preventDefault();s==='ai'?$('[data-act=send]').click():$('[data-act=at]').click()}});
async function imp(e){const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(j.app!=='GOJI AI'||!j.data)throw 0;const d=j.data;if(!confirm('Esto sustituirá tus datos actuales por la copia. ¿Continuar?'))return;S={projects:d.projects||[],ideas:d.ideas||[],movies:d.movies||[],games:d.games||[],chat:d.chat||[],gz:d.gz||{},ais:d.ais||[]};commit();toast('Copia importada correctamente.')}catch(er){toast('El archivo no es una copia válida de GOJI AI.')}}
document.addEventListener('change',e=>{if(e.target.dataset.act==='tg'){const D=e.target.dataset,z=by(D.k,D.id)[CFG[D.k].c].find(x=>x.id===D.t);z.done=e.target.checked;commit()}});
/* ---------- IA (solo lectura) ---------- */
const strip=a=>a.map(({img,...r})=>r);
const SYS='Eres GOJI AI, asistente de Goji Empires, un estudio de videojuegos. Responde en español, de forma breve y clara. Usa SIEMPRE las herramientas para consultar los datos del usuario y basa tus respuestas solo en ellos. Si no hay datos suficientes, dilo; no inventes proyectos, películas ni puntuaciones. Solo puedes leer datos: si sugieres cambios, indícalos para que el usuario los haga. Puedes recomendar películas pendientes del catálogo usando géneros, colecciones y puntuaciones de las vistas; no afirmes dónde está disponible una película.';
const T=(name,description,fn)=>({name,description,inputSchema:{type:'object',properties:{}},execute:async()=>fn()});
const TOOLS=[T('listar_proyectos','Proyectos con estado, progreso y tareas',()=>strip(S.projects).map(p=>({...p,progreso:pct(p,'tasks')}))),T('listar_ideas','Ideas con categoría y si están archivadas',()=>S.ideas.map(i=>({titulo:i.title,categoria:i.cat,descripcion:i.body,archivada:!!i.arc}))),T('listar_peliculas','Catálogo de películas vistas y pendientes',()=>S.movies.map(({id,...m})=>m)),T('listar_videojuegos','Videojuegos con plataforma y trofeos',()=>strip(S.games)),T('listar_godzilla','Películas de Godzilla vistas con puntuación personal',()=>GZ.filter(f=>S.gz?.[f[0]]?.status==='Vista').map(f=>({titulo:f[1],año:f[2],era:f[3],puntuacion:S.gz[f[0]].rating??null})))];
async function ask(text){if(pv!=='native')return askBE(text);const sm=window.claude?.use?await claude.use('sample'):null;if(!sm){toast('La IA no está disponible en esta vista: se necesita abrir GOJI AI desde claude.ai.');return}
S.chat.push({role:'user',content:text});const last={role:'assistant',content:''};S.chat.push(last);busy=true;render();
let h=S.chat.slice(-13,-1).map(m=>({role:m.role,content:m.content}));while(h[0]?.role!=='user')h.shift();h[0].content=SYS+'\n\n'+h[0].content;
const up=()=>{const l=$('#log');if(l){l.innerHTML=chatHTML();l.scrollTop=l.scrollHeight}};
try{const r=await sm(h,{tools:TOOLS,cache:false,onText:({text})=>{last.content=text;up()}});last.content=r.text}catch(er){last.content=er.code==='not_granted'?'Permiso denegado para usar la IA.':er.code==='rate_limited'?'Límite alcanzado, inténtalo en un momento.':'Error de la IA ['+(er.code||'desconocido')+']: '+(er.message||'sin detalle')}
busy=false;save();render()}
/* ---------- recordatorios ---------- */
function due(){const n=Date.now();let ch=0;S.movies.forEach(m=>{if(m.remind&&!m.done_r&&m.status!=='Vista'&&new Date(m.remind)<=n){m.done_r=true;ch=1;const t='Hoy toca ver: '+m.title;toast('⏰ '+t,15000);try{if('Notification'in window&&Notification.permission==='granted')new Notification('GOJI AI',{body:t})}catch(e){}}});if(ch){save();if(view==='movies')render()}}
(async()=>{const d=await load();if(d)S={...S,...d};render();save();due();setInterval(due,30000);if(!window.claude?.use)pv=localMode?'abacus':'openai';beLoad()})();
</script></body></html>
