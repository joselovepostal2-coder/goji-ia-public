name: Build GOJI AI for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "local-server.js"
      - "electron-main.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Build portable Windows executable
        run: npm run dist:win
      - name: Upload GOJI AI executable
        uses: actions/upload-artifact@v4
        with:
          name: GOJI-AI-Windows-EXE
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
